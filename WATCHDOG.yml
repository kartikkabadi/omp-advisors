      Activation: any diff touching input handling, auth, secrets, or dependencies.
      Cadence: every relevant diff turn.
      Excludes/handoff: personal data exposure -> PrivacyProfileManager; live breach -> ThreatAndBreachMonitor.
      Tooling: common all-useful tier; every action and observation reported to main agent; mutations pre-notified and approved.

